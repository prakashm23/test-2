<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Selfie Capture</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes glow {
    0%, 100% { box-shadow: 0 0 10px rgba(34,197,94,0.4); }
    50% { box-shadow: 0 0 20px rgba(34,197,94,0.9); }
}

@keyframes scan {
    0% { top: 20%; opacity: 0; }
    50% { opacity: 1; }
    100% { top: 80%; opacity: 0; }
}

.face-frame {
    animation: glow 2s infinite ease-in-out;
}

.scan-line {
    position: absolute;
    width: 70%;
    height: 2px;
    background: #22c55e;
    animation: scan 2.5s infinite;
}
</style>
</head>

<body class="bg-gray-100 p-6">

<h2 class="text-2xl font-bold text-center mb-6">Selfie Verification</h2>

<!-- Instruction -->
<div class="bg-blue-50 border border-blue-200 text-blue-700 text-sm p-3 rounded-lg mb-6 max-w-xl mx-auto text-center">
    Align your face inside the frame. Ensure good lighting and keep your face clearly visible.
</div>

<!-- Main Layout -->
<div class="flex flex-col md:flex-row gap-6 justify-center items-start">

    <!-- LEFT: Camera -->
    <div>
        <div class="relative">
            <video id="video" autoplay class="w-[300px] h-[400px] rounded-xl bg-black object-cover"></video>

            <!-- Face Frame -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="face-frame w-[200px] h-[260px] border-4 border-green-400 rounded-full relative flex items-center justify-center">
                    <div class="scan-line"></div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-[300px] bg-white p-4 rounded-xl shadow-md mt-4 space-y-4">

            <!-- Brightness -->
            <div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="font-semibold">Brightness</span>
                    <span id="brightnessValue">100%</span>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="adjustBrightness(-10)" class="px-3 py-1 bg-gray-200 rounded">−</button>
                    <input type="range" id="brightness" min="50" max="200" value="100" class="w-full">
                    <button onclick="adjustBrightness(10)" class="px-3 py-1 bg-gray-200 rounded">+</button>
                </div>
            </div>

            <!-- Zoom -->
            <div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="font-semibold">Zoom</span>
                    <span id="zoomValue">1x</span>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="adjustZoom(-0.1)" class="px-3 py-1 bg-gray-200 rounded">−</button>
                    <input type="range" id="zoom" min="1" max="2" step="0.1" value="1" class="w-full">
                    <button onclick="adjustZoom(0.1)" class="px-3 py-1 bg-gray-200 rounded">+</button>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="mt-4 flex gap-3 justify-center">
            <button onclick="capture()" class="bg-blue-600 text-white px-5 py-2 rounded-lg">Capture</button>
            <button onclick="recapture()" class="bg-gray-500 text-white px-5 py-2 rounded-lg">Re-Capture</button>
        </div>
    </div>

    <!-- RIGHT: Preview -->
    <div class="bg-white p-4 rounded-xl shadow-md w-[320px] text-center">
        <h3 class="font-semibold mb-3">Captured Preview</h3>

        <div class="border-2 border-dashed border-gray-300 rounded-xl p-2">
            <img id="preview" class="w-[300px] h-[400px] rounded-lg bg-black mx-auto"/>
        </div>

        <p class="text-xs text-gray-500 mt-3">
            Make sure your face is clearly visible before proceeding.
        </p>
    </div>

</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');

const brightness = document.getElementById('brightness');
const zoom = document.getElementById('zoom');

const brightnessValue = document.getElementById('brightnessValue');
const zoomValue = document.getElementById('zoomValue');

// Camera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
.then(stream => video.srcObject = stream)
.catch(() => alert("Camera access denied!"));

// Filters
function applyFilters() {
    video.style.filter = `brightness(${brightness.value}%)`;
    video.style.transform = `scale(${zoom.value})`;

    brightnessValue.innerText = brightness.value + "%";
    zoomValue.innerText = zoom.value + "x";
}

brightness.addEventListener('input', applyFilters);
zoom.addEventListener('input', applyFilters);

// Adjust
function adjustBrightness(val) {
    let v = Math.min(200, Math.max(50, parseInt(brightness.value) + val));
    brightness.value = v;
    applyFilters();
}

function adjustZoom(val) {
    let v = Math.min(2, Math.max(1, parseFloat(zoom.value) + val));
    zoom.value = v.toFixed(1);
    applyFilters();
}

// Capture
function capture() {
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.filter = `brightness(${brightness.value}%)`;

    const scale = zoom.value;
    const sw = video.videoWidth / scale;
    const sh = video.videoHeight / scale;
    const sx = (video.videoWidth - sw) / 2;
    const sy = (video.videoHeight - sh) / 2;

    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    preview.src = canvas.toDataURL('image/png');
}

// Recapture
function recapture() {
    preview.src = "";
}
</script>

</body>
</html>
